<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실험실 안전수칙</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe9ef;--ink:#1d2b36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1115;--ink:#e8eef2}}
:root[data-theme="dark"]{--bg:#0d1115;--ink:#e8eef2}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#hint{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:0;right:0;text-align:center;font-size:13px;opacity:.7}
@media (orientation:portrait){#hint{display:block}}
#st{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#009fd9}
.s{position:absolute;inset:0;display:none;background-size:100% 100%;background-color:#009fd9}
.s.on{display:block;animation:f .4s}
@keyframes f{from{opacity:0}}
.b{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:99cqw;background:#00ffcc;color:#10323a;font:inherit;font-size:1.9cqw;padding:.9cqw 2.6cqw;cursor:pointer;box-shadow:0 .3cqw 0 #00b08f;white-space:nowrap}
.b:active{box-shadow:none}
.cap{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);margin:0;color:#fff;font-size:1.7cqw;text-align:center;white-space:nowrap}
.desk{position:absolute;left:30%;right:30%;bottom:0;height:22%;background:#e2610f;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.x{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.x.p{animation:pop .75s cubic-bezier(.2,1.6,.4,1) forwards}
.x.big{animation:big 1s ease-in forwards}
@keyframes pop{0%{transform:scale(.15);opacity:0}25%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes big{from{transform:scale(1);opacity:1}to{transform:scale(8);opacity:1}}
#boom{transition:background-color .3s}
#boom.shake{animation:sh .12s 6}
@keyframes sh{50%{transform:translate(.6cqw,-.4cqw)}}
.pn{position:absolute;left:52%;top:15%;width:44%;height:71%;background:#c9d0d8f2;border-radius:4cqw;padding:3cqw 2.6cqw;overflow:auto;color:#1d2b36;font-size:1.8cqw;line-height:1.6}
.pn h3{margin:0 0 1.2cqw;font-size:2.3cqw;font-weight:400}
.pn p{margin:0 0 1.6cqw;display:flex;gap:1cqw}
.pn p b{flex:none;width:3cqw;height:3cqw;border-radius:50%;background:#e2610f;color:#fff;font-weight:400;text-align:center;line-height:3cqw}
.bx{position:absolute;top:33.6%;width:27.2%;height:52.7%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;color:#1d2b36;font-size:1.8cqw}
.sh{width:55%;aspect-ratio:1;background:#00ffcc;border:0;cursor:pointer;padding:0;transition:transform .2s}
.sh:hover{transform:scale(1.06)}
.tri{clip-path:polygon(50% 5%,100% 100%,0 100%)}.sq{width:50%}.ci{border-radius:50%}
.done .sh{background:#9be7d4}
.ck{background:#fcd53b}
.pn2{position:absolute;left:4%;top:17%;width:67%;height:77%;background:#fdebd9;border-radius:4cqw;padding:2cqw 2.6cqw;overflow:auto}
.it{display:flex;gap:1.4cqw;align-items:flex-start;padding:1.1cqw 0;font-size:2cqw;line-height:1.45;color:#1d2b36;cursor:pointer;border-bottom:.15cqw dashed #e8c9a8}
.it input{flex:none;width:2.4cqw;height:2.4cqw;margin:0;accent-color:#e2610f}
.it:has(input:checked){opacity:.55}
.bat{position:absolute;left:79%;top:17%;width:15%;height:77%;border-radius:99cqw;background:#94bfcf;border:.35cqw solid #5f93a6;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.4cqw;color:#10323a}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:#3ddc84;transition:height .4s}
.bat span{position:relative}
.big2{font-size:2.6cqw;min-width:34cqw}
.end h2{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);margin:0;font-weight:400;color:#fff;font-size:4.4cqw;text-align:center}
.qr{position:absolute;right:4%;bottom:5%;display:flex;align-items:flex-end;gap:1.2cqw;color:#fff;font-size:1.7cqw}
.qr img{width:10cqw;background:#fff;padding:.6cqw;display:block}
</style></head><body>

vxR4JDAqfWh9mtxFPafeOWySoAVt/uPTPfstggAAAAAA=',l:'호흡기',t:'호흡기로 약품 가스를 흡입했을 때',s:['실험을 즉시 중단하고 오염된 장소에서 벗어나 신선한 공기가 있는 안전한 곳으로 이동한다. 가스가 퍼진 장소에 다시 들어가지 말고, 가스가 퍼진 구역에 진입하지 않는다.','안전한 곳에서 선생님에게 즉시 알리고 기침, 목 따가움, 어지러움, 가슴 답답함, 호흡곤란 등의 증상이 있는지 확인한다. 움직임을 최소화하고 호흡하기 편한 자세로 안정을 취한다.','호흡곤란이나 심한 기침 등 이상 증상이 나타나면 즉시 119에 신고한다. 증상이 가벼워 보여도 화학물질 흡입은 시간이 지나 증상이 나타날 수 있으므로 교사에게 알리고 의료진의 판단을 받는다.']},

const CK=[{t:'실험 전 안전체크리스트',s:'tri',i:['보안경, 실험복, 장갑 등 필요한 보호장구를 착용했는가?','긴 머리를 묶고 실험복과 신발을 제대로 착용했는가?','실험에 사용할 약품의 이름과 위험 표시를 확인했는가?','약품 사용 방법과 주의사항을 선생님께 확인했는가?','비커, 시험관 등 실험 기구에 균열이나 파손이 없는가?','실험대 위에 실험과 관계없는 물건을 치웠는가?','세안기, 비상 샤워기, 소화기 및 비상구 위치를 알고 있는가?']},
{t:'실험 중 안전체크리스트',s:'sq',i:['선생님의 안내와 실험 순서를 지키고 있는가?','약품을 임의로 섞거나 정해진 양보다 많이 사용하지 않는가?','약품을 직접 손으로 만지거나 냄새를 맡지 않는가?','시험관이나 용기의 입구를 사람 쪽으로 향하지 않았는가?','약품이 튀거나 흘러내린 곳은 없는가?','환기가 필요한 실험은 지정된 환기 시설에서 진행하고 있는가?','가열 기구와 실험 장비를 사용 중인 상태로 자리를 비우지 않는가?']},
{t:'실험 후 안전체크리스트',s:'ci',i:['사용한 실험 기구를 세척하고 지정된 장소에 정리했는가?','남은 약품을 종류에 맞게 분류하고 지정된 폐액통에 처리했는가?','약품을 임의로 싱크대에 버리지 않았는가?','시약 용기의 뚜껑을 닫고 원래 위치에 보관했는가?','가스 밸브, 수도꼭지, 전열 기구를 확인하고 정리했는가?','실험대에 남은 약품이나 오염물을 담당 선생님의 지침에 따라 정리했는가?','보호장구를 정리하고 손을 깨끗이 씻었는가?','실험 중 발생한 사고, 파손, 이상 증상을 선생님에게 보고했는가?']}];
const mk=(tag,cls,html,at)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;Object.assign(e,at||{});return e};

// 체크리스트 화면 10·11·12 + 선택 화면 도형
const done=[0,0,0];

 st.insertBefore(s,$('end'));
 const inp=[...s.querySelectorAll('input')],fill=s.querySelector('.fill'),pct=s.querySelector('.bat span'),back=s.querySelector('.b:last-child');
 const upd=()=>{const o=inp.filter(i=>i.checked).length,p=Math.round(o/inp.length*100);fill.style.height=p+'%';pct.textContent=p+'%';done[n]=o===inp.length?1:0;back.style.display=done[n]?'':'none'};
 inp.forEach(i=>i.onchange=upd);s._u=upd;s._r=()=>{inp.forEach(i=>i.checked=false);upd();s.querySelector('.pn2').scrollTop=0};
 const bx=mk('div','bx',`<button class="sh ${c.s}" aria-label="${c.t}"></button><span></span>`);
 bx.style.left=[4.3,36.5,69][n]+'%';bx.querySelector('button').onclick=()=>go('c'+n);$('test').appendChild(bx);bx._s=()=>{bx.classList.toggle('done',!!done[n]);bx.querySelector('span').textContent=(done[n]?'✓ 완료 · ':'')+c.t.replace(' 안전체크리스트','')};bx._s()});
function refresh(){document.querySelectorAll('.bx').forEach(b=>b._s());$('tnext').style.display=done.every(Boolean)?'':'none'}
function reset(){document.querySelectorAll('.ck').forEach(s=>s._r())}
let T=[];
function go(id){T.forEach(clearTimeout);T=[];document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id===id));if(id==='test')refresh();document.querySelectorAll('.pn,.pn2').forEach(p=>p.scrollTop=0)}

function mix(){go('boom');const b=$('boom'),xs=[...b.querySelectorAll('.x')],at=(ms,f)=>T.push(setTimeout(f,ms)),show=(i,c)=>xs.forEach((x,j)=>x.className='x'+(j===i?' '+c:''));
 b.style.backgroundImage=$('pick').style.backgroundImage;b.classList.remove('shake');xs.forEach(x=>x.className='x');
 at(80,()=>show(0,'p'));at(850,()=>show(1,'p'));at(1620,()=>{show(2,'p');b.classList.add('shake')});at(2500,()=>show(2,'big'));at(3000,()=>{b.style.backgroundImage='none';b.style.backgroundColor='#cfa300'});at(3700,()=>go('warn'))}
